name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  smoke-test:
    name: Smoke test Docker image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image built by CI
        run: docker pull ghcr.io/${{ github.repository_owner }}/taskflow:${{ github.event.workflow_run.head_sha }}

      - name: Run container and smoke test /api/health
        run: |
          docker run -d --name smoke \
            -e SECRET_KEY=ci-smoke-secret \
            -e FLASK_ENV=production \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/taskflow:${{ github.event.workflow_run.head_sha }}
          echo "Waiting for app to be ready..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/api/health; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:5000/api/health | grep '"status"' | grep '"ok"'
          docker logs smoke
          docker stop smoke

  terraform:
    name: Provision VM Azure (Terraform)
    runs-on: ubuntu-latest
    needs: smoke-test
    environment: production
    outputs:
      vm_ip: ${{ steps.tf_output.outputs.vm_ip }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform Init
        run: terraform init
        working-directory: infra/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="ssh_public_key=${{ secrets.VM_SSH_PUBLIC_KEY }}"
        working-directory: infra/terraform

      - name: Get VM IP
        id: tf_output
        run: |
          IP=$(terraform output -raw vm_public_ip)
          echo "vm_ip=$IP" >> $GITHUB_OUTPUT
        working-directory: infra/terraform

  deploy:
    name: Deploy app (Ansible)
    runs-on: ubuntu-latest
    needs: terraform
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ needs.terraform.outputs.vm_ip }} >> ~/.ssh/known_hosts

      - name: Generate Ansible inventory
        run: |
          cat > infra/ansible/inventory.ini <<EOF
          [servers]
          taskflow-vm ansible_host=${{ needs.terraform.outputs.vm_ip }} ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/id_rsa

          [servers:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Deploy with Ansible
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml \
            --extra-vars "image_tag=${{ github.event.workflow_run.head_sha }} app_image=ghcr.io/${{ github.repository_owner }}/taskflow"

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://${{ needs.terraform.outputs.vm_ip }}:5000/api/health; then
              echo "Remote health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Remote health check FAILED after 75s"
          exit 1

