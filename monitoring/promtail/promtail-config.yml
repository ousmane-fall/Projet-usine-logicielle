server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container_name
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_logging]
        action: keep
        regex: promtail
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_image]
        target_label: image
    pipeline_stages:
      # Essayer de parser les logs JSON émis par Flask
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            time: time
      # Promouvoir le champ "level" en label pour filtrer dans Grafana
      - labels:
          level:
          logger:
      # Utiliser le timestamp issu du log JSON si disponible
      - timestamp:
          source: time
          format: "2006-01-02 15:04:05,999"
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05Z07:00"
      # Fallback: si le JSON n'est pas parseable, laisser passer la ligne brute
      - output:
          source: message
