---
- name: Créer le répertoire du projet
  file:
    path: "{{ project_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Copier le docker-compose.yml
  copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "{{ project_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"

- name: Copier la configuration monitoring
  copy:
    src: "{{ playbook_dir }}/../../monitoring/"
    dest: "{{ project_dir }}/monitoring/"
    owner: "{{ ansible_user }}"

- name: Generer le fichier .env sur la VM
  copy:
    dest: "{{ project_dir }}/.env"
    owner: "{{ ansible_user }}"
    mode: "0600"
    content: |
      SECRET_KEY={{ secret_key }}
      FLASK_ENV=production
      DATABASE_URL=sqlite:///taskflow.db
      APP_PORT=5000
      PROMETHEUS_PORT=9090
      GRAFANA_PORT=3000
      LOKI_PORT=3100
      GRAFANA_ADMIN_USER={{ grafana_admin_user | default('admin') }}
      GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}

- name: Pull de l'image Docker
  community.docker.docker_image:
    name: "{{ app_image }}:{{ image_tag }}"
    source: pull

- name: Démarrer la stack avec Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    state: present
    pull: always
  environment:
    APP_IMAGE: "{{ app_image }}:{{ image_tag }}"
