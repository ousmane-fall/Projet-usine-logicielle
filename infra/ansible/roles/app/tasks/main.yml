---
- name: Créer le répertoire du projet
  file:
    path: "{{ project_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Copier le docker-compose.yml
  copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "{{ project_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"

- name: Copier la configuration monitoring
  copy:
    src: "{{ playbook_dir }}/../../monitoring/"
    dest: "{{ project_dir }}/monitoring/"
    owner: "{{ ansible_user }}"

- name: Pull de l'image Docker
  community.docker.docker_image:
    name: "{{ app_image }}:{{ image_tag }}"
    source: pull

- name: Démarrer la stack avec Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    state: present
    pull: always
  environment:
    APP_IMAGE: "{{ app_image }}:{{ image_tag }}"
